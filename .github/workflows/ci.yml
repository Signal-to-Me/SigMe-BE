name: CI

# dev로 모이는 기능 브랜치와 main으로 올리는 릴리스 PR을 모두 검증한다.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# 같은 브랜치에 새 커밋이 오면 진행 중인 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 빌드와 테스트
    runs-on: ubuntu-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v5

      - name: JDK 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # build.gradle.kts의 Java Toolchain과 같은 버전을 사용한다.
          java-version: '25'

      - name: Gradle 설정과 캐시
        uses: gradle/actions/setup-gradle@v4

      # gradlew가 저장소에 실행 비트 없이 등록되어 있어 러너에서 직접 부여한다.
      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      # 테스트는 src/test/resources/application.yml의 H2 인메모리 설정을 사용하므로
      # 외부 데이터베이스나 시크릿이 필요하지 않다.
      - name: 빌드와 테스트 실행
        run: ./gradlew build

      - name: 테스트 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test
          retention-days: 7
