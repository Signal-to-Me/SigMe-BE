name: 버그
description: 동작하지 않는 것
title: "[버그] "
body:
  - type: dropdown
    id: domain
    attributes:
      label: 도메인
      options:
        - 인증 (auth)
        - 사용자 (user)
        - 습관 (habit)
        - 복약 (medication)
        - 월경 (menstrual)
        - 정신과 (psychiatric)
        - 빙고 (bingo)
        - 인사말 (greeting)
        - 통계 (stats)
        - 공통 (global)
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      value: |
        1.
        2.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 로그 / 스택트레이스
      render: text
