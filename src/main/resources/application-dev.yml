spring:
  jpa:
    hibernate:
      # 엔티티 기준으로 스키마를 재생성한다. 애플리케이션 종료 시 테이블이 삭제된다.
      ddl-auto: create-drop
    # 실행되는 쿼리를 로그로 확인한다.
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.sigme.be: debug
    # 바인딩 파라미터까지 확인할 때 아래를 trace로 올린다.
    org.hibernate.orm.jdbc.bind: info
