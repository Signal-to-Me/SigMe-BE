# 테스트 전용 설정.
# 외부 DB에 의존하지 않도록 인메모리 H2를 사용한다.
# PostgreSQL 고유 문법이 필요해지면 Testcontainers로 옮긴다.

spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # 엔티티 기준으로 스키마를 만든다. 운영 스키마 SQL은 사용하지 않는다.
      ddl-auto: create-drop

sigme:
  jwt:
    # 이 파일이 메인의 application.yml 을 가리므로 필요한 값을 모두 적는다.
    # 테스트 전용 고정 값이라 환경 변수 없이 실행된다.
    secret-key: 4tejr0geRbrSO+WMX+2y8Iwkw2jtwfZL1fuuDwaJ84U=
    issuer: sigMe-test-issuer
    access-token-ttl: 30m
    refresh-token-ttl: 30d

server:
  # 임의의 빈 포트를 사용해 실행 중인 애플리케이션과 충돌하지 않게 한다.
  port: 0

logging:
  level:
    root: warn
    com.sigme.be: info
